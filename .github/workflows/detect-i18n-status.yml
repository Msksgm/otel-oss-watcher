name: Detect i18n status
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC (09:00 JST)
  workflow_dispatch: # 手動実行

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run detection script
        run: bash scripts/detect-i18n-status.sh

      - name: Commit and push if changed
        run: |
          git add reports/
          git diff --cached --quiet reports/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update i18n status reports"
          git push

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_OTEL_IO }}
        run: |
          UNTRANSLATED_COUNT=$(wc -l < reports/untranslated-pages.txt | tr -d ' ')
          DRIFTED_COUNT=$(wc -l < reports/drifted-pages.txt | tr -d ' ')
          REMOVED_COUNT=$(wc -l < reports/removed-pages.txt | tr -d ' ')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \":globe_with_meridians: *opentelemetry.io i18n status*\n未翻訳ページ: ${UNTRANSLATED_COUNT} 件\ndrifted ページ: ${DRIFTED_COUNT} 件\n削除/リネームされたページ: ${REMOVED_COUNT} 件\"
            }"
